<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>365BET - 嘴炮王足球竞猜</title>
<style>
:root {
  --bg: #0d0d1a;
  --card: #16162a;
  --card2: #1e1e3a;
  --primary: #00e676;
  --primary-dim: rgba(0,230,118,0.15);
  --gold: #ffd740;
  --gold-dim: rgba(255,215,64,0.15);
  --red: #ff5252;
  --red-dim: rgba(255,82,82,0.12);
  --blue: #448aff;
  --blue-dim: rgba(68,138,255,0.12);
  --text: #f0f0f0;
  --text2: #9090b0;
  --border: rgba(255,255,255,0.06);
  --radius: 14px;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  padding-bottom: 76px; overflow-x: hidden;
}
.header {
  position:sticky; top:0; z-index:100;
  background:linear-gradient(135deg,#0d0d1a 0%,#1a0a2e 100%);
  padding:14px 18px 10px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
.header h1 {
  font-size:22px; font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--primary));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  flex:1;
}
.user-btn {
  display:flex; align-items:center; gap:6px;
  background:var(--card2); border:1px solid var(--border);
  border-radius:20px; padding:4px 14px 4px 8px;
  color:var(--text); font-size:13px; cursor:pointer; white-space:nowrap;
}
.user-btn .avatar { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; background:var(--primary-dim); color:var(--primary); }
.settings-btn { background:none; border:none; color:var(--text2); font-size:18px; cursor:pointer; padding:4px; line-height:1; }

.tabs {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:linear-gradient(0deg,#0d0d1a 0%,rgba(13,13,26,0.98) 100%);
  border-top:1px solid var(--border);
  display:flex; padding:4px 0 env(safe-area-inset-bottom);
}
.tab {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 0 4px; cursor:pointer; color:var(--text2);
  font-size:10px; transition:color .2s; border:none; background:none;
}
.tab.active { color:var(--primary); }
.tab .icon { font-size:20px; line-height:1.2; }

.content { display:none; padding:12px 14px; }
.content.active { display:block; }

.match-card {
  background:var(--card); border-radius:var(--radius); padding:14px 16px;
  margin-bottom:12px; border:1px solid var(--border);
}
.match-header {
  display:flex; align-items:center; gap:8px; margin-bottom:10px;
}
.league-badge {
  font-size:10px; font-weight:600; padding:2px 10px; border-radius:10px;
}
.league-badge.英超 { background:var(--primary-dim); color:var(--primary); }
.league-badge.欧冠 { background:var(--blue-dim); color:var(--blue); }
.league-badge.世界杯 { background:var(--gold-dim); color:var(--gold); }
.match-time { font-size:11px; color:var(--text2); flex:1; text-align:right; }
.match-status {
  font-size:10px; font-weight:600; padding:2px 8px; border-radius:8px;
  background:var(--card2);
}
.match-status.待预测 { color:var(--blue); background:var(--blue-dim); }
.match-status.已预测 { color:var(--gold); background:var(--gold-dim); }
.match-status.待结算 { color:var(--primary); background:var(--primary-dim); }
.match-status.已结算 { color:var(--text2); }
.match-status.流局 { color:var(--red); background:var(--red-dim); }

.match-teams {
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:12px;
}
.team { display:flex; align-items:center; gap:8px; flex:1; }
.team.away { flex-direction:row-reverse; }
.team .name { font-size:14px; font-weight:600; }
.team .logo { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; background:var(--card2); }
.match-score {
  font-size:22px; font-weight:800; color:var(--text); text-align:center;
  min-width:50px;
}
.match-score .vs { font-size:14px; font-weight:400; color:var(--text2); }
.match-score-input {
  display:flex; align-items:center; gap:4px; justify-content:center;
}
.match-score-input input {
  width:36px; height:36px; border-radius:8px; border:1px solid var(--border);
  background:var(--card2); color:var(--text); font-size:18px; font-weight:700;
  text-align:center; outline:none;
}
.match-score-input input:focus { border-color:var(--primary); }

.btn {
  padding:6px 16px; border-radius:8px; border:none; font-size:12px; font-weight:600;
  cursor:pointer; transition:opacity .2s;
}
.btn:active { opacity:.7; }
.btn-primary { background:var(--primary); color:#000; }
.btn-gold { background:var(--gold); color:#000; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-small { padding:4px 12px; font-size:11px; }

.summary-card {
  background:linear-gradient(135deg,var(--card),var(--card2));
  border-radius:var(--radius); padding:18px; margin-bottom:16px;
  border:1px solid var(--border); text-align:center;
}
.summary-card .big-num { font-size:36px; font-weight:800; margin:6px 0; }
.summary-card .big-num.positive { color:var(--primary); }
.summary-card .big-num.negative { color:var(--red); }
.summary-card .big-num.zero { color:var(--text2); }
.summary-row {
  display:flex; justify-content:space-around; gap:12px; margin-top:12px;
}
.summary-item { text-align:center; }
.summary-item .label { font-size:11px; color:var(--text2); }
.summary-item .value { font-size:18px; font-weight:700; margin-top:2px; }
.bill-item {
  background:var(--card); border-radius:var(--radius); padding:12px 14px;
  margin-bottom:8px; border:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
.bill-item .match-info { flex:1; }
.bill-item .match-info .teams { font-size:13px; font-weight:600; }
.bill-item .match-info .detail { font-size:11px; color:var(--text2); margin-top:2px; }
.bill-amount { font-size:16px; font-weight:700; text-align:right; }
.bill-amount.positive { color:var(--primary); }
.bill-amount.negative { color:var(--red); }

.rank-card {
  background:var(--card); border-radius:var(--radius); padding:12px 16px;
  margin-bottom:8px; border:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
}
.rank-num {
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800;
}
.rank-num.gold { background:var(--gold); color:#000; }
.rank-num.silver { background:#a0a0b0; color:#000; }
.rank-num.bronze { background:#cd7f32; color:#fff; }
.rank-num.normal { background:var(--card2); color:var(--text2); }
.rank-info { flex:1; }
.rank-info .name { font-size:14px; font-weight:600; }
.rank-info .stats { font-size:11px; color:var(--text2); margin-top:2px; }
.rank-score { text-align:right; }
.rank-score .pts { font-size:20px; font-weight:800; color:var(--gold); }
.rank-score .label { font-size:10px; color:var(--text2); }

.modal-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,.7); display:none;
  align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--card); border-radius:var(--radius);
  padding:24px; width:100%; max-width:380px;
  border:1px solid var(--border); max-height:80vh; overflow-y:auto;
}
.modal h2 { font-size:18px; margin-bottom:16px; text-align:center; }
.modal-close {
  float:right; background:none; border:none; color:var(--text2);
  font-size:20px; cursor:pointer; padding:4px;
}
.user-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.user-option {
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:14px 8px; border-radius:12px; border:2px solid transparent;
  background:var(--card2); cursor:pointer; transition:all .2s;
}
.user-option:hover { border-color:var(--text2); }
.user-option.selected { border-color:var(--primary); background:var(--primary-dim); }
.user-option .avatar-big {
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:700;
}
.user-option .un { font-size:13px; font-weight:600; }

.admin-panel {
  background:var(--card); border-radius:var(--radius); padding:16px;
  margin-bottom:14px; border:1px solid var(--gold-dim);
  display:none;
}
.admin-panel.show { display:block; }
.admin-panel h3 { font-size:14px; color:var(--gold); margin-bottom:12px; }
.admin-panel label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; }
.admin-panel input, .admin-panel select {
  width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--card2); color:var(--text); font-size:13px; margin-bottom:10px; outline:none;
}
.admin-panel input:focus { border-color:var(--gold); }
.admin-row { display:flex; gap:8px; }
.admin-row input { flex:1; }
.stake-option input:checked+span { background:var(--gold)!important; color:#000!important; border-color:var(--gold)!important; }

.debt-summary {
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;
}
.debt-box {
  background:var(--card); border-radius:var(--radius); padding:14px;
  text-align:center; border:1px solid var(--border);
}
.debt-box .label { font-size:11px; color:var(--text2); }
.debt-box .value { font-size:22px; font-weight:800; margin-top:4px; }
.debt-item {
  background:var(--card); border-radius:var(--radius); padding:12px 14px;
  margin-bottom:8px; border:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.debt-item .arrow { color:var(--text2); font-size:16px; }
.debt-amount { font-size:15px; font-weight:700; margin-left:auto; }
.debt-amount.positive { color:var(--primary); }
.debt-amount.negative { color:var(--red); }

.empty-state { text-align:center; padding:40px 20px; color:var(--text2); }
.empty-state .icon { font-size:48px; margin-bottom:12px; opacity:.5; }
.empty-state p { font-size:13px; }

.toast {
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
  background:var(--card2); color:var(--text); padding:10px 20px;
  border-radius:10px; font-size:13px; z-index:300;
  border:1px solid var(--border); box-shadow:var(--shadow);
  animation: toastIn .3s ease;
}
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

.admin-toggle {
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px; margin-top:4px; border-top:1px solid var(--border);
}
.admin-toggle label { font-size:11px; color:var(--text2); cursor:pointer; }
.switch { position:relative; display:inline-block; width:36px; height:20px; cursor:pointer; }
.switch input { display:none; }
.switch .slider {
  position:absolute; inset:0; background:var(--card2);
  border-radius:20px; transition:.3s;
}
.switch .slider::before {
  content:''; position:absolute; left:2px; top:2px;
  width:16px; height:16px; border-radius:50%; background:var(--text2); transition:.3s;
}
.switch input:checked+.slider { background:var(--gold-dim); }
.switch input:checked+.slider::before { background:var(--gold); transform:translateX(16px); }

.loading {
  text-align:center; padding:60px 20px; color:var(--text2);
}
.loading .spin {
  display:inline-block; width:32px; height:32px; border:3px solid var(--card2);
  border-top-color:var(--primary); border-radius:50%;
  animation: spin .8s linear infinite; margin-bottom:12px;
}
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.match-card,.bill-item,.rank-card,.debt-item { animation:fadeIn .3s ease; }

@media (min-width:600px) {
  .content { max-width:600px; margin:0 auto; }
  .user-grid { grid-template-columns:1fr 1fr 1fr; }
}
</style>
</head>

</div>

// ======================== STATE ========================
let state = {
  users: USERS.map((n,i)=>({id:i,name:n})),
  matches: [], predictions: [], settlementLogs: [],
  currentUser: localStorage.getItem('zuipao_user') !== null ? parseInt(localStorage.getItem('zuipao_user')) : null,
  isAdmin: false, loaded: false
};

// ======================== DATA LOADING ========================
async function loadFromSupabase() {
  try {
    let { data: matches, error } = await supabase.from('matches').select('*').order('date');
    if (error) throw error;

    if (!matches || matches.length === 0) {
      const { error: insErr } = await supabase.from('matches').insert(SEED_MATCHES);
      if (insErr) throw insErr;
      const { data: m2 } = await supabase.from('matches').select('*').order('date');
      matches = m2 || [];
    }

    state.matches = matches || [];

    const { data: preds } = await supabase.from('predictions').select('*');
    state.predictions = preds || [];

    const { data: logs } = await supabase.from('settlement_logs').select('*').order('created_at', { ascending: false });
    state.settlementLogs = logs || [];

    await settleAllPending();
    state.loaded = true;
  } catch (e) {
    console.error('Supabase load error:', e);
    document.getElementById('matchList').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>数据库连接失败，请刷新重试</p><p style="font-size:11px;margin-top:6px;color:var(--text2);">${e.message}</p></div>`;
  }
}

function getPreds(matchId) { return state.predictions.filter(p => p.match_id === matchId); }
function getPred(matchId, name) { return state.predictions.find(p => p.match_id === matchId && p.user_name === name); }

function getStats(name) {
  let balance=0, wins=0, losses=0;
  state.matches.filter(m=>m.settled&&m.settlement).forEach(m=>{
    const s=m.settlement;
    if(s.type==='void') return;
    if(s.winners&&s.winners.includes(name)){balance+=s.amountPerWinner;wins++}
    if(s.losers&&s.losers.includes(name)){balance-=s.amountPerLoser;losses++}
  });
  return { balance: Math.round(balance*100)/100, wins, losses };
}

function getCurrUser() { return state.currentUser!==null&&state.currentUser!==undefined ? state.users[state.currentUser] : null; }

// ======================== SETTLEMENT ========================
async function settleMatch(match) {
  if (!match.home_score || !match.away_score || match.home_score===null || match.away_score===null || match.settled) return;
  const preds = getPreds(match.id);
  const winners = preds.filter(p => p.home_score===match.home_score && p.away_score===match.away_score).map(p=>p.user_name);
  const losers = USERS.filter(n => !winners.includes(n));
  const fee = match.stake||10;
  let settlement;

  if (winners.length===0) {
    settlement = { type:'void', winners:[], losers:USERS, amountPerLoser:0, amountPerWinner:0, totalPot:0 };
  } else {
    const pot = losers.length * fee;
    const perW = Math.floor((pot / winners.length)*100)/100;
    const rem = Math.round((pot - perW*winners.length)*100)/100;
    settlement = { type:'settled', winners, losers, amountPerWinner: perW, amountPerLoser: fee, totalPot: pot, remainder: rem };
  }

  await supabase.from('matches').update({ settled:true, settlement: JSON.stringify(settlement) }).eq('id', match.id);
  const detail = settlement.type==='void'
    ? `${match.home} ${match.home_score}-${match.away_score} ${match.away} · 底注¥${fee} · 无人猜中，本场流局`
    : `${match.home} ${match.home_score}-${match.away_score} ${match.away} · 底注¥${fee} · 赢家: ${winners.join(', ')}，每人得 ¥${settlement.amountPerWinner.toFixed(2)}`;
  await supabase.from('settlement_logs').insert({ match_id: match.id, detail });

  match.settled = true;
  match.settlement = settlement;
  state.settlementLogs.unshift({ match_id: match.id, detail, created_at: new Date().toISOString() });
}

async function settleAllPending() {
  for (const m of state.matches) {
    if (m.home_score!=null && m.away_score!=null && !m.settled) await settleMatch(m);
  }
}

function getStatus(m) {
  if (m.settled) return { label: m.settlement?.type==='void'?'流局':'已结算', cls: m.settlement?.type==='void'?'流局':'已结算' };
  if (m.home_score!=null) return { label:'待结算', cls:'待结算' };
  const u=getCurrUser();
  if (u&&getPred(m.id,u.name)) return { label:'已预测', cls:'已预测' };
  return { label:'待预测', cls:'待预测' };
}

function renderDebts() {
  const el=document.getElementById('debtContent');
  if(!state.loaded){el.innerHTML='<div class="loading"><div class="spin"></div><p>加载中...</p></div>';return;}
  const all=state.users.map(u=>{const s=getStats(u.name);return{...u,...s};}).filter(u=>u.balance!==0).sort((a,b)=>b.balance-a.balance);
  const cr=all.filter(u=>u.balance>0).map(u=>({...u}));
  const dr=all.filter(u=>u.balance<0).map(u=>({...u}));
  const sets=[]; let ci=0,di=0;
  while(ci<cr.length&&di<dr.length){const amt=Math.min(cr[ci].balance,-dr[di].balance);if(amt>0.01)sets.push({from:dr[di].name,to:cr[ci].name,amount:Math.round(amt*100)/100});cr[ci].balance=Math.round((cr[ci].balance-amt)*100)/100;dr[di].balance=Math.round((dr[di].balance+amt)*100)/100;if(cr[ci].balance<0.01)ci++;if(dr[di].balance>-0.01)di++;}
  const cu=getCurrUser();
  const sc=state.matches.filter(m=>m.settled&&m.settlement?.type==='settled').length;
  const vc=state.matches.filter(m=>m.settlement?.type==='void').length;
  let dh='';
  if(sets.length===0) dh='<div class="empty-state"><div class="icon">🤝</div><p>暂无欠款，大家两清！</p></div>';
  else dh=sets.map(s=>{const mf=cu&&s.from===cu.name,mt=cu&&s.to===cu.name;return`<div class="debt-item"><span style="font-weight:600;">${s.from}</span><span class="arrow">➜</span><span style="font-weight:600;">${s.to}</span><div class="debt-amount negative" style="margin-left:8px;">¥${s.amount.toFixed(2)}${mf?'<span style="font-size:10px;color:var(--text2);">(你欠)</span>':''}${mt?'<span style="font-size:10px;color:var(--primary);">(应收)</span>':''}</div></div>`;}).join('');
  const logs=state.settlementLogs.slice(0,20);
  let lh=logs.length?logs.map(l=>`<div class="bill-item" style="padding:10px 14px;"><div class="match-info"><div class="detail">${l.detail}</div><div style="font-size:10px;color:var(--text2);margin-top:2px;">${l.created_at?new Date(l.created_at).toLocaleString('zh-CN'):''}</div></div></div>`).join(''):'<div class="empty-state"><div class="icon">📭</div><p>暂无结算记录</p></div>';
  el.innerHTML=`<div style="font-size:13px;font-weight:600;margin:0 0 10px 4px;">📋 结算概况</div><div class="debt-summary"><div class="debt-box"><div class="label">✅ 已结算场次</div><div class="value" style="color:var(--primary);">${sc}</div></div><div class="debt-box"><div class="label">💤 流局场次</div><div class="value" style="color:var(--text2);">${vc}</div></div></div><div style="font-size:13px;font-weight:600;margin:14px 0 8px 4px;">🔄 结算关系</div>${dh}<div style="font-size:13px;font-weight:600;margin:14px 0 8px 4px;">📜 结算记录</div>${lh}`;
}

async function submitPrediction(matchId){
  const u=getCurrUser();
  if(!u){showToast('请先选择身份');showUserSelect();return;}
  const m=state.matches.find(x=>x.id===matchId);
  if(!m||m.settled||m.home_score!=null){showToast('比赛已结束');return;}
  if(Date.now()>m.date){showToast('比赛已开始');return;}
  const h=parseInt(document.getElementById(`ph_${matchId}`)?.value);
  const a=parseInt(document.getElementById(`pa_${matchId}`)?.value);
  if(isNaN(h)||isNaN(a)||h<0||a<0){showToast('请输入有效比分');return;}
  const {error}=await supabase.from('predictions').insert({match_id:matchId,user_name:u.name,home_score:h,away_score:a});
  if(error&&error.code==='23505'){showToast('你已经提交过预测了！');return;}
  if(error){showToast('提交失败，请重试');return;}
  state.predictions.push({match_id:matchId,user_name:u.name,home_score:h,away_score:a});
  renderAll();showToast(`✅ 已提交 ${m.home} ${h}-${a} ${m.away}`);
}

async function enterResult(matchId){
  if(!state.isAdmin) return;
  const m=state.matches.find(x=>x.id===matchId);
  if(!m) return;
  const h=parseInt(document.getElementById(`rh_${matchId}`)?.value);
  const a=parseInt(document.getElementById(`ra_${matchId}`)?.value);
  if(isNaN(h)||isNaN(a)||h<0||a<0){showToast('请输入有效比分');return;}
  await supabase.from('matches').update({home_score:h,away_score:a}).eq('id',matchId);
  m.home_score=h;m.away_score=a;
  await settleMatch(m);renderAll();showToast(`✅ ${m.home} ${h}-${a} ${m.away} 已录入并结算`);
}

}

  }));

  // League filters
  document.querySelectorAll('#leagueFilters .btn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#leagueFilters .btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');renderMatches();
  }));

  // User button
  document.getElementById('userBtn').addEventListener('click',showUserSelect);
  document.getElementById('closeModalBtn').addEventListener('click',()=>closeModal('userModal'));
  document.getElementById('userModal').addEventListener('click',function(e){if(e.target===this)closeModal('userModal');});

  // Admin
  document.getElementById('adminBtn').addEventListener('click',toggleAdmin);
  document.getElementById('adminSwitch').addEventListener('change',toggleAdmin);

  // Add match
  document.getElementById('addMatchBtn').addEventListener('click',addMatch);
  document.querySelectorAll('#stakeOptions .stake-option').forEach(el=>el.addEventListener('click',function(){selectStake(this.querySelector('span'));}));

  // Event delegation for dynamic buttons (predict/result)
  document.getElementById('matchList').addEventListener('click',e=>{
    const btn=e.target.closest('[data-act]');
    if(!btn) return;
    if(btn.dataset.act==='predict') submitPrediction(btn.dataset.mid);
    if(btn.dataset.act==='result') enterResult(btn.dataset.mid);
  });

  // Re-bind bill's select user button
  document.getElementById('billContent').addEventListener('click',e=>{
    if(e.target.id==='selUserBtn') showUserSelect();
  });
}

function toggleAdmin(){
  state.isAdmin=!state.isAdmin;
  document.getElementById('adminSwitch').checked=state.isAdmin;
  document.getElementById('adminPanel').classList.toggle('show',state.isAdmin);
  renderAll();
}

// ======================== INIT ========================
async function init(){
  bindEvents();
  await loadFromSupabase();
  setupRealtime();
  updateUserUI();renderAll();
  if(state.currentUser===null||state.currentUser===undefined) setTimeout(showUserSelect,500);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
